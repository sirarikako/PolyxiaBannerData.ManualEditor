name: 02 - Temporary build validation

# This caller exists only on codex/cloud-build-validation.
# It must not be included in the formal PR. After 02-build.yml and its docs are
# committed and pushed on codex/cloud-build, Codex branches to
# codex/cloud-build-validation and replaces BOTH 40-character placeholders below
# with that SAME formal commit SHA, then commits and pushes this file.
# Never push this file with placeholder SHAs.
#
# It calls the same-repository 02-build.yml with platform=both and no secrets.

on:
  push:
    branches:
      - codex/cloud-build-validation
    paths:
      - .github/workflows/02-build-validation.yml

permissions:
  contents: read

jobs:
  build:
    name: Validate 02-build with both platforms
    uses: sirarikako/PolyxiaBannerData.ManualEditor/.github/workflows/02-build.yml@a2d0fa515b96bcdd53d315e899610fc432fd2cd9
    with:
      platform: both
      source_ref: 'a2d0fa515b96bcdd53d315e899610fc432fd2cd9'
